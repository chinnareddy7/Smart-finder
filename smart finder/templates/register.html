{% extends 'base.html' %}

{% block title %}Student Registration - Smart Lost & Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="form-card">
                <div class="text-center mb-4">
                    <span class="brand-icon-box mb-2" style="width: 50px; height: 50px; font-size: 1.5rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </span>
                    <h3 class="fw-bold text-dark mt-2">Create Student Account</h3>
                    <p class="text-muted small">Register to report lost items, claim found belongings, and receive AI match alerts</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="student_id" class="form-label">Student Roll / ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="student_id" name="student_id" 
                                   value="{{ form_data.student_id if form_data else '' }}" 
                                   placeholder="e.g. CS202488" required>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ form_data.name if form_data else '' }}" 
                                   placeholder="e.g. Rahul Sharma" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="email" class="form-label">College Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ form_data.email if form_data else '' }}" 
                                   placeholder="name@campus.edu" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Mobile Number <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="phone" name="phone" 
                                   value="{{ form_data.phone if form_data else '' }}" 
                                   placeholder="+91 98765 43210" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label">Academic Department <span class="text-danger">*</span></label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="">Select your academic branch...</option>
                            <option value="Computer Science & Engineering" {% if form_data and form_data.department == 'Computer Science & Engineering' %}selected{% endif %}>Computer Science & Engineering</option>
                            <option value="Information Technology" {% if form_data and form_data.department == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                            <option value="Artificial Intelligence & Data Science" {% if form_data and form_data.department == 'Artificial Intelligence & Data Science' %}selected{% endif %}>Artificial Intelligence & Data Science</option>
                            <option value="Electronics & Communication" {% if form_data and form_data.department == 'Electronics & Communication' %}selected{% endif %}>Electronics & Communication</option>
                            <option value="Electrical & Electronics" {% if form_data and form_data.department == 'Electrical & Electronics' %}selected{% endif %}>Electrical & Electronics</option>
                            <option value="Mechanical Engineering" {% if form_data and form_data.department == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                            <option value="Civil Engineering" {% if form_data and form_data.department == 'Civil Engineering' %}selected{% endif %}>Civil Engineering</option>
                            <option value="Biotechnology" {% if form_data and form_data.department == 'Biotechnology' %}selected{% endif %}>Biotechnology</option>
                            <option value="Business Administration / Management" {% if form_data and form_data.department == 'Business Administration / Management' %}selected{% endif %}>Business Administration / Management</option>
                            <option value="Basic Sciences & Humanities" {% if form_data and form_data.department == 'Basic Sciences & Humanities' %}selected{% endif %}>Basic Sciences & Humanities</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 characters" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type password" required>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required checked>
                        <label class="form-check-label small text-muted" for="terms">
                            I agree to the campus honor code and acknowledge that private contact details are only released for verified property claims.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-person-check-fill me-1"></i> Register Account
                    </button>
                </form>

                <div class="text-center small text-muted border-top pt-3">
                    Already registered? 
                    <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary text-decoration-none">Sign In Here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
